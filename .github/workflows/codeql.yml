name: CodeQL

# Statische Sicherheitsanalyse fuer JavaScript/TypeScript und die
# Workflows: jeder Pull-Request, jeder Push auf main (Vergleichsbasis fuer
# die Ergebnisse der Pull-Requests) und woechentlich, damit neue Abfragen
# auch ohne Aenderung laufen. Advanced setup statt "Default setup" in den
# Einstellungen: versioniert und in lieferkette.test.ts geprueft. Beides
# zugleich geht nicht (GitHub weist die Ergebnisse dann ab); "Default
# setup" bleibt aus. Keine Pfadfilter am Ausloeser: eine Pflichtpruefung,
# die per Filter nicht startet, bliebe fuer immer "ausstehend".
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Wie in ci.yml: ein neuer Push bricht nur den Lauf desselben
# Pull-Requests ab, jeder andere Lauf hat seine eigene Gruppe
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  analyse:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Erwartet 5 bis 10 min fuer den ausgelieferten TypeScript-Code
    timeout-minutes: 30
    # security-events: Ergebnisse (SARIF) in den Security-Tab laden. Das
    # einzige Schreibrecht aller Workflows; jede Action dieses Jobs ist
    # deshalb per Commit festgelegt (lieferkette.test.ts). Dependabot
    # (github-actions) hebt Commit und Kommentar gemeinsam.
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # actions: die Workflows selbst (Ausdruecke in run:, Rechte,
        # Checkout fremder Staende)
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          # Interpretierte Sprachen: kein Build noetig
          build-mode: none
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
