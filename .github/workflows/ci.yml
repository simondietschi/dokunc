name: CI

on:
  push:
    # Dependabot-Branches laufen ueber pull_request, nicht doppelt.
    branches-ignore: ["dependabot/**"]
  pull_request:
  # Montags auch ohne Push: neue Advisories (pnpm audit, Trivy) und neue
  # Basis- oder Dienst-Images fallen so innert einer Woche auf. Laeuft
  # auf dem Standardbranch; die Fehlermail geht an die Person, die die
  # cron-Zeile zuletzt geaendert hat.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

# Kein Job schreibt ins Repository, in Issues oder Pakete. Caches und
# Artefakte laufen ueber das Laufzeit-Token von Actions.
permissions:
  contents: read

# Ein neuer Push auf einen Pull-Request bricht dessen laufenden Lauf ab:
# die Gruppe ist dann der Ref des Pull-Requests (refs/pull/N/merge). Jeder
# andere Lauf (Push auf main oder einen Branch, Montagslauf, Handstart)
# bekommt mit der run_id eine eigene Gruppe und laeuft zu Ende; so hat
# jeder Commit auf main seinen vollstaendigen Lauf. Push und
# Pull-Request desselben Branches laufen weiter beide (verschiedene
# Ereignisse). lieferkette.test.ts haelt den Ausdruck fest.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# Jeder Job hat eine Zeitgrenze. Ohne sie lief ein Haenger bis zur Grenze
# von GitHub (6 h): der e2e-Job von PR #12 hing nach dem letzten
# Playwright-Test. Die laengsten Laeufe bis Ende September 2026, auf ganze
# Minuten aufgerundet: audit 1, build-test 3, e2e 13 (rot mit
# Wiederholungen 20), docker 7. Die Grenzen lassen mindestens die Haelfte
# mehr, meist ein Mehrfaches.
# Laeuft die Grenze eines Jobs ab, bricht GitHub ihn ab (cancelled):
# Schritte mit failure() oder !cancelled() entfallen, nur always() laeuft
# noch. Im Job e2e ginge so der Upload der Traces verloren; dort enden
# Playwright und sein Schritt deshalb vorher (siehe dort). Im Job docker
# fehlten "Zustand und Logs bei Fehlschlag" und der Trivy-Scan des Images.
# Er hat trotzdem keine Schrittgrenzen: wo seine Schritte auf den Stack
# warten, zaehlen sie Versuche oder warten mit up --wait auf die
# Healthchecks (meist mit --wait-timeout 600). Was dann noch haengen
# kann, ist vor allem Build oder Pull am Netz, und dafuer zeigt das Log
# des Schritts mehr als die Logs der Container.
jobs:
  # Eigener Job: eine neue Advisory soll Lint, Tests und Build nicht
  # verdecken. Ausnahmen mit Begruendung: pnpm-workspace.yaml
  # (auditConfig) und .trivyignore.yaml (nur die betroffene Version).
  audit:
    name: Bekannte Luecken (pnpm audit, Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: pnpm installieren
        run: npm install -g pnpm@11.27.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # Liest nur das Lockfile, kein pnpm install noetig
      - name: pnpm audit
        run: pnpm audit --prod --audit-level high
      # ignoreGhsas gilt fuer alle Versionen eines Pakets; Trivy mit purls
      # meldet eine andere verwundbare Version desselben Pakets weiter.
      # Laeuft auch nach einem roten pnpm audit, sonst bliebe ein Befund,
      # den nur Trivy sieht, bis zur Behebung der Advisory verdeckt.
      - name: Lockfile auf Luecken pruefen (Trivy)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: pnpm-lock.yaml
          version: v0.74.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml

  # Geheimnisse in der Git-Historie des geprueften Stands: bei einem
  # Pull-Request main plus seine Commits, sonst der Branch. Nur HEAD, nicht
  # alle Branches: ohne --log-opts nimmt gitleaks "git log --all", und
  # fetch-depth 0 holt jeden Branch; ein Fund in einem fremden Branch
  # machte dann jeden Lauf rot. Knapp 200 Commits dauern unter 2 s.
  # Das Binary der Release statt der gitleaks-Action: kein fremder Code
  # mit dem Token, keine Lizenzfrage. Version und Pruefsumme von Hand
  # heben (gitleaks_<version>_checksums.txt der Release); Dependabot sieht
  # sie nicht. Fehlalarme: Fingerabdruck mit Begruendung in
  # .gitleaksignore (CONTRIBUTING.md).
  geheimnisse:
    name: Geheimnisse in der Historie (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          # Ganze Historie; ohne sie saehe gitleaks nur den letzten Commit
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks installieren
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # --verbose zeigt je Fund Datei, Zeile, Commit und Fingerabdruck,
      # --redact ersetzt den gefundenen Wert im Log durch REDACTED
      - name: Historie pruefen
        id: pruefen
        run: '"$RUNNER_TEMP/gitleaks" git . --no-banner --redact --verbose --exit-code 1 --log-opts="--full-history HEAD"'
      - name: Hinweis bei einem Fund
        if: failure() && steps.pruefen.outcome == 'failure'
        run: |
          {
            echo "### gitleaks found a possible secret"
            echo "The log of the step \"Historie pruefen\" shows file, line, commit and fingerprint; the value itself is redacted."
            echo "Treat the value as leaked and revoke it first: the repository is public, and rewriting history does not undo that."
            echo "If it is a false positive, add its fingerprint to .gitleaksignore with a comment that says why (CONTRIBUTING.md)."
          } >> "$GITHUB_STEP_SUMMARY"

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # prisma.config.ts löst DATABASE_URL strikt auf — für generate/build
      # reicht ein Platzhalter (es wird keine Verbindung aufgebaut).
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7

      # Billigster Schritt zuerst. Ein Konfliktmarker in einer Datei ohne
      # Compiler oder Linter (.env.example, README, SQL) faellt sonst
      # nirgends auf und wird ausgeliefert.
      - name: Keine Merge-Konfliktmarker
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>) ' -- . ':(exclude).github/workflows/ci.yml'; then
            echo "Unaufgeloeste Konfliktmarker gefunden."
            exit 1
          fi

      # Node 26 liefert Corepack nicht mehr mit — das Dockerfile hält das
      # fest und installiert pnpm deshalb über npm. Mit `corepack enable`
      # hing die Bereitstellung hier an der Corepack-Version des
      # vorinstallierten Runner-Node statt an dem Node, gegen das gebaut
      # wird; verschwindet Corepack aus dem Image, brechen beide Jobs ab,
      # bevor irgendetwas installiert ist. Muss vor setup-node stehen,
      # weil `cache: pnpm` den Store-Pfad über ein laufendes pnpm sucht.
      - name: pnpm installieren
        run: npm install -g pnpm@11.27.1

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @dokunc/db generate

      - name: Lint
        run: pnpm lint

      # Konfigurationsschema (packages/config): Pruefung, Maskierung,
      # Startlog. Der Gleichlauf mit .env.example und Compose laeuft im
      # Unit-Lauf der Web-App (konfiguration.test.ts).
      - name: Unit tests Konfiguration
        run: pnpm --filter @dokunc/config test

      - name: Unit tests
        run: pnpm --filter @dokunc/web test

      # Grenzen, Bremse, Ticketverbrauch und Ablauf des Doc-Resets des
      # Collab-Servers — ohne Redis und Datenbank, deshalb hier und nicht
      # im e2e-Job.
      - name: Unit tests collab server
        run: pnpm --filter @dokunc/collab test

      - name: Typecheck collab server
        run: pnpm --filter @dokunc/collab build

      # Die Pakete sah bisher nur tsc der Apps, und nur soweit diese sie
      # importieren. Ein Fehler in einer Datei, die keine App einbindet
      # (etwa prisma.config.ts), fiel so nirgends auf. Die Web-App laeuft
      # hier mit tsc: next build verwirft Meldungen aus *.test.ts und
      # *.spec.ts, und dort stehen Typzusicherungen (@ts-expect-error in
      # search-params.test.ts und browser-events.test.ts).
      - name: Typecheck Pakete und Web-App
        run: pnpm typecheck

      - name: Build web
        run: pnpm --filter @dokunc/web build
        env:
          NODE_ENV: production

  e2e:
    runs-on: ubuntu-latest
    # Summe der Schrittgrenzen (Integrationstests 15, E2E 35) plus 10 min
    # fuer die unbegrenzten Schritte und den Upload; siehe "E2E tests"
    timeout-minutes: 60
    services:
      # Images wie in docker-compose.yml (db, redis); lieferkette.test.ts
      # haelt beide gleich, Dependabot pflegt nur die Compose-Datei.
      postgres:
        image: postgres:18-trixie
        env:
          POSTGRES_USER: dokunc
          POSTGRES_PASSWORD: dokunc
          POSTGRES_DB: dokunc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dokunc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dokunc:dokunc@localhost:5432/dokunc?schema=public
      REDIS_URL: redis://localhost:6379
      APP_SECRET: ci-only-secret-please-32-chars-minimum!!
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_COLLAB_URL: ws://localhost:3001
      COLLAB_PORT: 3001
    steps:
      - uses: actions/checkout@v7

      # Node 26 liefert Corepack nicht mehr mit — das Dockerfile hält das
      # fest und installiert pnpm deshalb über npm. Mit `corepack enable`
      # hing die Bereitstellung hier an der Corepack-Version des
      # vorinstallierten Runner-Node statt an dem Node, gegen das gebaut
      # wird; verschwindet Corepack aus dem Image, brechen beide Jobs ab,
      # bevor irgendetwas installiert ist. Muss vor setup-node stehen,
      # weil `cache: pnpm` den Store-Pfad über ein laufendes pnpm sucht.
      - name: pnpm installieren
        run: npm install -g pnpm@11.27.1

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @dokunc/db generate

      - name: Run migrations
        run: pnpm --filter @dokunc/db migrate:deploy

      # Vergessene Migration: das Schema nach allen Migrationen (in einer
      # eigenen, leeren Schattendatenbank aufgebaut; pg_trgm verlangt eine
      # eigene Datenbank, kein Schema) muss schema.prisma entsprechen.
      # Exit 2 = Unterschied, die Zusammenfassung steht im Log.
      - name: Schema gegen Migrationen (prisma migrate diff)
        env:
          SHADOW_DATABASE_URL: postgresql://dokunc:dokunc@localhost:5432/dokunc_schatten
        run: |
          PGPASSWORD=dokunc psql -h localhost -U dokunc -d dokunc -v ON_ERROR_STOP=1 -c 'CREATE DATABASE dokunc_schatten'
          pnpm --filter @dokunc/db migrate:check

      # Der Ausfalltest (apps/web/test/integration/collab-chaos.test.ts)
      # startet eigene redis-server-Prozesse, die er anhaelt, voll macht
      # und neu startet; den Dienst-Container oben kann er dafuer nicht
      # nehmen. policy-rc.d haelt das Paket davon ab, einen System-Redis
      # auf 6379 zu starten, wo der Dienst-Container lauscht. Ubuntu 24.04
      # liefert Redis 7.0, die kleinste Version, die der Collab-Server
      # braucht. Ohne redis-server scheitert der Test hier (CI gesetzt).
      - name: redis-server fuer den Chaos-Test
        run: |
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
          sudo chmod +x /usr/sbin/policy-rc.d
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends redis-server
          sudo rm /usr/sbin/policy-rc.d
          redis-server --version

      # Autorisierungstests gegen die echte Datenbank: die Regeln
      # stecken in den Abfragen, ein Mock würde sie nur nachbauen.
      # Gemessen bis 3:42 (Ende September 2026); mit den Tests des
      # Collab-Servers mit eigenen Prozessen lokal 8:30, davon gut 3 min
      # der Ausfalltest. Haengt ein Test, scheitert der Schritt nach
      # 15 min, statt dass die Grenze des Jobs ablaeuft und den Upload
      # unten mitnimmt.
      - name: Authorization integration tests
        timeout-minutes: 15
        run: pnpm test:integration

      - name: Build web
        run: pnpm --filter @dokunc/web build

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      # Drei Stufen, jede ueber der vorigen.
      # 1. Budget von Playwright fuer den ganzen Lauf, Start und Beenden der
      # Server eingeschlossen (--global-timeout, in ms: 30 min). Ist es
      # aufgebraucht, bricht Playwright selbst ab, auch wenn es nach dem
      # letzten Test beim Beenden der Server haengt (PR #12), schreibt
      # Zusammenfassung und Annotationen und endet binnen 30 s. 30 min
      # reichen fuer den laengsten gruenen Lauf (gut 6 min bis Ende
      # September 2026) und drei Tests, die beide Versuche bis an ihre
      # 180 s laufen (je 6 min), mit Reserve.
      # 2. Grenze des Schritts, nur fuer das, was danach noch haengt. Laeuft
      # sie ab, beendet der Runner nur die Shell des Schritts: Playwright
      # liefe verwaist weiter, ohne Zusammenfassung und Annotationen im Log,
      # und der Upload unten kaeme, waehrend es noch in test-results/
      # schreibt. Der Schritt gilt aber als gescheitert, der Upload laeuft.
      # 3. Grenze des Jobs, 10 min ueber der Summe der Schrittgrenzen
      # (Integrationstests und dieser Schritt): fuer die unbegrenzten
      # Schritte davor und den Upload. Laeuft sie zuerst ab, bricht GitHub
      # den Job ab (cancelled), und der Upload mit failure() entfaellt, wie
      # in PR #12.
      - name: E2E tests
        timeout-minutes: 35
        run: pnpm test:e2e --global-timeout 1800000

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Prüft genau den Weg aus dem README: frisch geklont, keine .env,
  # ein `docker compose up -d`. Fängt Image-/Compose-Fehler ab, die
  # weder Unit- noch E2E-Tests sehen.
  docker:
    name: Docker-Stack (ohne .env)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Sicherstellen, dass keine .env existiert
        run: test ! -f .env

      # Dateien, die nie ins Image duerfen (.dockerignore, geprueft von
      # apps/web/src/image-inhalt.test.ts), als Attrappen im Build-Kontext.
      # Keine davon heisst .env: Compose liest nur diese, der Schritt davor
      # bleibt gueltig. Die Liste liest "Keine Geheimnisse im Image".
      - name: Attrappen von Geheimnissen im Build-Kontext
        run: |
          printf '%s\n' .env.local .env.production apps/web/.env.local \
            apps/collab/dump.rdb dump.rdb scripts/app_secret \
            .claude/settings.local.json > "$RUNNER_TEMP/attrappen"
          while read -r f; do
            mkdir -p "$(dirname "$f")"
            echo "ATTRAPPE=nicht-im-image" > "$f"
          done < "$RUNNER_TEMP/attrappen"

      # Fester Projektname (name: dokunc) und der Weg einer Installation,
      # deren Projekt bisher wie ihr Verzeichnis hiess, mit
      # scripts/projektname.sh. Nachgestellt vor dem ersten Start des
      # Stacks, solange es keine dokunc_*-Volumes gibt: Volumes mit den
      # Labels, die Compose setzt, sind genau das, was das Skript liest
      # (ein echter alter Stack braeuchte einen zweiten Image-Build).
      # a) vor dem ersten Start: Exit 1; b) nach einem Start ohne
      # Festschreiben (juengere dokunc-Volumes): Exit 2; c) Festschreiben
      # an eine .env ohne Zeilenende, danach heisst das Projekt dort
      # wikialt. Die nachgestellten Volumes werden wieder entfernt.
      - name: Compose-Projektname
        run: |
          set -euo pipefail
          test "$(docker compose config | sed -n '1p')" = 'name: dokunc'
          ./scripts/projektname.sh
          ALT="$RUNNER_TEMP/Wiki Alt"
          mkdir -p "$ALT"
          git archive HEAD | tar -x -C "$ALT"
          volume() {
            docker volume create --label "com.docker.compose.project=$1" \
              --label "com.docker.compose.volume=$2" "$1_$2" >/dev/null
          }
          aufraeumen() {
            docker volume rm wikialt_db_data wikialt_app_data dokunc_db_data dokunc_app_data >/dev/null 2>&1 || true
          }
          trap aufraeumen EXIT
          pruefe() {
            local code=0
            (cd "$ALT" && ./scripts/projektname.sh) 2>"$RUNNER_TEMP/projektname.err" || code=$?
            cat "$RUNNER_TEMP/projektname.err"
            test "$code" = "$1" || { echo "Exit $code statt $1"; exit 1; }
            grep -qF "$2" "$RUNNER_TEMP/projektname.err"
          }
          volume wikialt db_data
          volume wikialt app_data
          pruefe 1 'Vermutlich hiess das Projekt bisher wikialt'
          sleep 2
          volume dokunc db_data
          volume dokunc app_data
          pruefe 2 'Rückweg: docker compose -p dokunc down (ohne -v)'
          printf 'APP_URL=http://localhost:7891' > "$ALT/.env"
          # Ohne Zugriff auf Docker: Abbruch, die .env bleibt, wie sie war.
          code=0
          (cd "$ALT" && DOCKER_HOST=unix:///nicht-da.sock ./scripts/projektname.sh --festschreiben) || code=$?
          test "$code" = 3
          test "$(cat "$ALT/.env")" = 'APP_URL=http://localhost:7891'
          (cd "$ALT" && ./scripts/projektname.sh --festschreiben)
          grep -qx 'APP_URL=http://localhost:7891' "$ALT/.env"
          grep -qx 'COMPOSE_PROJECT_NAME=wikialt' "$ALT/.env"
          test "$(cd "$ALT" && docker compose config | sed -n '1p')" = 'name: wikialt'
          (cd "$ALT" && ./scripts/projektname.sh)
          aufraeumen
          trap - EXIT
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=dokunc)"
          test ! -f .env

      - name: Stack bauen und starten
        id: start
        run: docker compose up -d --build --wait --wait-timeout 600

      # Caddy stellt beim ersten Start sein internes Zertifikat aus; bis
      # dahin bricht der TLS-Handshake ab. Der Proxy hat keinen
      # Healthcheck, auf den `--wait` warten könnte — also hier pollen.
      #
      # Der Port kommt aus derselben Vorgabe wie in docker-compose.yml
      # (APP_PORT, Vorgabe 7891). Fest verdrahtetes https://localhost
      # zeigte auf 443, und den veroeffentlicht der Proxy nicht: der
      # Schritt scheiterte deshalb bei jedem Lauf mit "Failed to connect
      # to localhost port 443", obwohl der Stack vollstaendig hochkam.
      - name: Health-Endpunkt über den Proxy
        run: |
          PORT="${APP_PORT:-7891}"
          for i in $(seq 1 30); do
            if curl -fsSk "https://localhost:$PORT/api/health" | grep -q '"status":"ok"'; then
              echo "Proxy antwortet auf Port $PORT (Versuch $i)"
              exit 0
            fi
            sleep 2
          done
          echo "Proxy hat auf Port $PORT nach 60 s nicht geantwortet"
          exit 1

      # Die Attrappen von oben fehlen unter /app, ebenso die Arbeitsordner
      # .claude und .github. Mit der frueheren .dockerignore lagen dort
      # .env.local, .env.production, apps/web/.env.local, beide dump.rdb,
      # scripts/app_secret, .claude und .github. Der erste Aufruf haelt
      # fest, dass exec ueberhaupt antwortet; sonst hiesse jeder
      # Fehlschlag von `test -e` "fehlt". </dev/null, weil exec sonst die
      # Liste der Schleife als eigene Eingabe liest.
      - name: Keine Geheimnisse im Image
        run: |
          docker compose exec -T app test -f /app/package.json
          fehler=0
          while read -r f; do
            if docker compose exec -T app test -e "/app/$f" </dev/null; then
              echo "/app/$f im Image"
              fehler=1
            fi
          done < <(cat "$RUNNER_TEMP/attrappen"; printf '%s\n' .claude .github)
          exit "$fehler"

      # Die Stufe runner entfernt npm, npx und corepack (Dockerfile): nichts
      # im Container ruft sie auf, und das npm des Basis-Images brachte
      # eigene Abhaengigkeiten mit Luecken mit (Trivy unten). Geprueft am
      # gebauten Image: kein solcher Befehl im PATH, und im globalen
      # Paketordner liegt nur pnpm. Brachte ein neues Basis-Image npm an
      # anderer Stelle zurueck, faellt es hier auf, nicht erst als Luecke.
      - name: Kein npm im Image
        run: |
          docker compose exec -T app sh -c '
            fehler=0
            for b in npm npx corepack; do
              if command -v "$b"; then fehler=1; fi
            done
            global=$(ls /usr/local/lib/node_modules)
            if [ "$global" != pnpm ]; then echo "/usr/local/lib/node_modules: $global"; fehler=1; fi
            exit "$fehler"'

      - name: Anmeldeseite wird ausgeliefert
        run: curl -fsSk "https://localhost:${APP_PORT:-7891}/login" -o /dev/null

      - name: APP_SECRET wurde automatisch erzeugt
        run: |
          docker compose exec -T app sh -c 'test -s /app/data/app_secret'

      # Der Stack ist hier frisch und ohne Konto: die App hat beim Start das
      # Einrichtungs-Token angelegt (Vorgabe /app/data/setup_token im Volume
      # app_data, schreibbar trotz read_only) und es genau einmal geloggt.
      # Gezaehlt wird der Tokenwert selbst, nicht nur die Meldung: sonst
      # bliebe der Schritt gruen, wenn nur der Pfad im Log stuende. Nach
      # einem Neustart desselben Containers steht er weiter genau einmal
      # dort (nicht bei jedem Start), und der neue Start nennt nur die
      # Datei.
      # Derselbe Container: `up` ohne --no-recreate hat ihn hier nach dem
      # Neustart neu angelegt (warum, blieb offen; lokal mit Compose 5.1
      # nicht nachgestellt). Sein Log begann leer, der Schritt zaehlte 0 und
      # scheiterte, ohne den Neustart zu pruefen. Jetzt wartet `up` nur auf
      # den Healthcheck, und gleiche ID und neue Startzeit belegen den
      # Neustart. Die Meldung zur Datei zaehlt erst ab dieser Startzeit:
      # beim ersten Start loest sie schon die Anmeldeseite oben aus. Sie
      # kommt ohne await nach dem Start (instrumentation.ts), darum das
      # Warten; erst danach wird wieder gezaehlt, sonst entginge ein Token,
      # das der neue Start noch schreibt.
      # Die Logs erst in eine Variable: grep in einer Pipe liesse `logs` an
      # SIGPIPE sterben, und pipefail machte daraus einen Fehlschlag.
      - name: Einrichtungs-Token beim ersten Start
        timeout-minutes: 4
        run: |
          set -euo pipefail
          docker compose exec -T app sh -c 'test -s /app/data/setup_token && test "$(stat -c %a /app/data/setup_token)" = 600'
          TOKEN=$(docker compose exec -T app cat /app/data/setup_token | tr -d '\r\n')
          test -n "$TOKEN"
          LOGS=$(docker compose logs --no-log-prefix app)
          test "$(grep -cF "$TOKEN" <<<"$LOGS")" -eq 1 || { echo "Token nicht genau einmal im Log"; exit 1; }
          ID=$(docker compose ps -q app)
          VORHER=$(docker inspect -f '{{.State.StartedAt}}' "$ID")
          docker compose restart app
          docker compose up -d --no-recreate --wait --wait-timeout 180 app
          test "$(docker compose ps -q app)" = "$ID" || { echo "App-Container neu angelegt statt neu gestartet"; exit 1; }
          START=$(docker inspect -f '{{.State.StartedAt}}' "$ID")
          test "$START" != "$VORHER" || { echo "App-Container nicht neu gestartet"; exit 1; }
          for i in $(seq 1 30); do
            LOGS=$(docker compose logs --no-log-prefix --since "$START" app)
            grep -qF 'Einrichtungs-Token liegt in der Datei' <<<"$LOGS" && break
            sleep 1
          done
          grep -qF 'Einrichtungs-Token liegt in der Datei' <<<"$LOGS" || { echo "Der neue Start nennt die Datei nicht"; exit 1; }
          LOGS=$(docker compose logs --no-log-prefix app)
          test "$(grep -cF "$TOKEN" <<<"$LOGS")" -eq 1 || { echo "Token nach dem Neustart nicht genau einmal im Log"; exit 1; }

      # Die Update-Befehle aus dem README ("Update und Rueckweg") ohne
      # git pull, als Kette wie dort. Belegt, dass sie laufen und der Stack
      # danach gesund ist. "|| exit 1" ist noetig: set -e bricht in einer
      # &&-Liste nur ab, wenn das letzte Glied scheitert. Ohne es liefe der
      # Schritt nach einem gescheiterten pull oder build --pull weiter und
      # faende den alten Stack gesund.
      # Dass build --pull das Basis-Image neu holt, zeigt dieser Schritt
      # nicht, nur ein Versuch mit einem Basis-Image, das es nur lokal gibt:
      # up --build baut damit ohne Pull, build --pull scheitert mit "pull
      # access denied" (Commit 91285f0).
      # Die zweite Zeile: pull scheitert ohne --ignore-buildable, sobald eine
      # override-Datei der App ein image: gibt.
      # Beide Zeilen prueft apps/web/src/lieferkette.test.ts gegen das README.
      - name: Update-Weg aus dem README
        run: |
          set -euo pipefail
          docker compose pull --ignore-buildable && docker compose build --pull && docker compose up -d --wait || exit 1
          printf 'services:\n  app:\n    image: dokunc-app-nur-lokal\n' > "$RUNNER_TEMP/app-image.yml"
          docker compose -f docker-compose.yml -f "$RUNNER_TEMP/app-image.yml" pull --ignore-buildable
          for i in $(seq 1 30); do
            curl -fsSk "https://localhost:${APP_PORT:-7891}/api/health" | grep -q '"status":"ok"' && exit 0
            sleep 2
          done
          echo "Nach dem Update antwortet der Proxy nicht"
          exit 1

      # Ohne .env nimmt der Proxy nur auf dem Loopback an (APP_BIND,
      # Vorgabe 127.0.0.1). Die Schritte oben sehen das nicht: sie fragen
      # localhost und bekaemen auch von 0.0.0.0 eine Antwort. Hier zaehlt,
      # woran Docker den Port wirklich gebunden hat.
      - name: Proxy ohne .env nur auf 127.0.0.1
        run: test "$(docker compose port proxy 443)" = "127.0.0.1:${APP_PORT:-7891}"

      # APP_BIND und APP_BIND6 muessen die Bindeadressen aller
      # Compose-Dateien setzen, und leer wie nicht gesetzt faellt jede auf
      # den Loopback zurueck. Geprueft mit docker compose selbst, das die
      # Interpolation vornimmt (der Unit-Test compose-ports.test.ts sieht
      # nur den Text der Dateien).
      - name: APP_BIND und APP_BIND6 werden uebernommen
        run: |
          ALLE=docker-compose.yml:docker-compose.domain.yml:docker-compose.ipv6.yml
          bindungen() {
            docker compose config --format json \
              | jq -c '[.services.proxy.ports[] | "\(.host_ip) \(.published)->\(.target)"] | sort'
          }
          LOOPBACK='["127.0.0.1 7891->443","127.0.0.1 80->80","::1 7891->443","::1 80->80"]'
          test "$(COMPOSE_FILE=$ALLE bindungen)" = "$LOOPBACK"
          test "$(COMPOSE_FILE=$ALLE APP_BIND= APP_BIND6= bindungen)" = "$LOOPBACK"
          test "$(COMPOSE_FILE=$ALLE APP_BIND=0.0.0.0 APP_BIND6=:: APP_PORT=443 bindungen)" \
            = '["0.0.0.0 443->443","0.0.0.0 80->80",":: 443->443",":: 80->80"]'

      # Leer wie nicht gesetzt muss beim Proxy `internal` ankommen: mit
      # einem leeren Wert bricht Caddy schon am Parsen der Caddyfile ab.
      # Eine Mailadresse muss unveraendert durchgehen (ACME).
      - name: CADDY_TLS wird uebernommen, leer gilt internal
        run: |
          tls() {
            docker compose config --format json | jq -r '.services.proxy.environment.CADDY_TLS'
          }
          test "$(tls)" = internal
          test "$(CADDY_TLS= tls)" = internal
          test "$(CADDY_TLS=admin@example.com tls)" = admin@example.com

      # Proxy nur mit der App im Netz edge, Gotenberg nur mit der App im
      # internen Netz render, Datenbank und Redis im Standardnetz ohne den
      # Proxy (docker-compose.yml, networks). Fuer docker-compose.yml allein
      # und mit beiden Zusaetzen, weil jede Datei die Dienste erweitern kann.
      - name: Netze getrennt (Konfiguration)
        run: |
          set -euo pipefail
          ALLE=docker-compose.yml:docker-compose.domain.yml:docker-compose.ipv6.yml
          for dateien in docker-compose.yml "$ALLE"; do
            cfg=$(COMPOSE_FILE=$dateien docker compose config --format json)
            test "$(jq -cS '.services | map_values(.networks | keys)' <<<"$cfg")" \
              = '{"app":["default","edge","render"],"db":["default"],"gotenberg":["render"],"proxy":["edge"],"redis":["default"]}'
            test "$(jq -cS '.networks | map_values(.internal // false)' <<<"$cfg")" \
              = '{"default":false,"edge":false,"render":true}'
          done

      # Jeder Dienst, auch ein kuenftiger, in jeder Dateikombination: alle
      # Faehigkeiten abgegeben, keine neuen Rechte, Dateisystem
      # schreibgeschuetzt, Grenzen fuer Speicher und Prozesse, Logs
      # rotiert (json-file mit max-size und max-file). Welche
      # Faehigkeiten zurueckkommen und ob alles wirkt, prueft der Schritt
      # "Container gehaertet (am Stack)".
      - name: Container gehaertet (Konfiguration)
        run: |
          set -euo pipefail
          ALLE=docker-compose.yml:docker-compose.domain.yml:docker-compose.ipv6.yml
          for dateien in docker-compose.yml "$ALLE"; do
            fehlt=$(COMPOSE_FILE=$dateien docker compose config --format json | jq -c '.services
              | map_values(select((.cap_drop == ["ALL"]
                  and ((.security_opt // []) | index("no-new-privileges:true") != null)
                  and .read_only == true and .mem_limit != null and .pids_limit != null
                  and .logging.driver == "json-file"
                  and (.logging.options["max-size"] // "") != ""
                  and (.logging.options["max-file"] // "") != "") | not))
              | keys')
            test "$fehlt" = '[]' || { echo "Ohne Haertung ($dateien): $fehlt"; exit 1; }
          done

      # Am laufenden Stack: Gotenberg kennt Datenbank und Redis nicht und
      # kommt nicht ins Internet; der Proxy erreicht die App, aber weder
      # Datenbank noch Redis, auch nicht ueber deren Adresse; die App
      # erreicht Gotenberg, Datenbank und Redis und hat Ausgang. Die
      # Zeilen vor jeder Negativprobe zeigen, dass getent, curl, wget und
      # nc im jeweiligen Image laufen.
      # curl -k: es geht um die Verbindung, nicht um das Zertifikat.
      - name: Netze getrennt (am Stack)
        run: |
          set -euo pipefail
          docker compose exec -T gotenberg getent hosts app >/dev/null
          docker compose exec -T gotenberg curl -fsS -o /dev/null --max-time 10 http://app:3000/api/health
          for dienst in db redis; do
            if docker compose exec -T gotenberg getent hosts "$dienst"; then
              echo "Gotenberg sieht $dienst"; exit 1
            fi
          done
          if docker compose exec -T gotenberg curl -ksS -o /dev/null --max-time 10 https://registry.npmjs.org/; then
            echo "Gotenberg erreicht das Internet"; exit 1
          fi
          docker compose exec -T proxy getent hosts app >/dev/null
          docker compose exec -T proxy wget -q -O /dev/null -T 10 http://app:3000/api/health
          docker compose exec -T proxy nc -z -w 5 app 3001
          for dienst in db redis; do
            if docker compose exec -T proxy getent hosts "$dienst"; then
              echo "Proxy sieht $dienst"; exit 1
            fi
          done
          # Per Adresse, wie ein Angreifer sie nutzte; dieselbe Verbindung
          # von der App aus ist die Gegenkontrolle
          verbindet() { docker compose exec -T app node -e "const s=require('node:net').connect($2,'$1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),5000)"; }
          for ziel in db:5432 redis:6379; do
            ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$(docker compose ps -q "${ziel%%:*}")")
            test -n "$ip"
            verbindet "$ip" "${ziel#*:}"
            if docker compose exec -T proxy nc -z -w 5 "$ip" "${ziel#*:}"; then
              echo "Proxy erreicht $ziel ueber $ip"; exit 1
            fi
          done
          docker compose exec -T app node -e 'fetch("http://gotenberg:3000/health").then(r=>process.exit(r.ok?0:1),()=>process.exit(1))'
          docker compose exec -T app node -e 'fetch("https://registry.npmjs.org/",{method:"HEAD"}).then(()=>process.exit(0),()=>process.exit(1))'

      # Wirkung der Haertung in jedem laufenden Container (die
      # Konfiguration prueft der Schritt oben): no-new-privileges, genau die
      # erlaubten Faehigkeiten (aus einem Prozess von docker exec gelesen,
      # dort steht die Vorgabe des Containers; PID 1 von Redis hat sie
      # schon selbst abgegeben), der Hauptprozess ohne wirksame Faehigkeit
      # (Proxy: nur NET_BIND_SERVICE), Dateisystem schreibgeschuetzt,
      # Grenzen im cgroup (v2, sonst v1). Gegenkontrolle: wo ein Dienst
      # schreiben muss, geht es.
      - name: Container gehaertet (am Stack)
        run: |
          set -euo pipefail
          grenze() {
            local w
            w=$(docker exec "$1" sh -c "cat /sys/fs/cgroup/$2 2>/dev/null || cat /sys/fs/cgroup/$3")
            [[ "$w" =~ ^[0-9]{1,15}$ ]] || { echo "$4: $2 unbegrenzt ($w)" >&2; exit 1; }
            echo "$w"
          }
          for s in $(docker compose config --services); do
            c=$(docker compose ps -q "$s")
            test -n "$c" || { echo "$s laeuft nicht"; exit 1; }
            eigen=$(docker exec "$c" cat /proc/self/status)
            haupt=$(docker exec "$c" cat /proc/1/status)
            grep -qx $'NoNewPrivs:\t1' <<<"$eigen" || { echo "$s: ohne no-new-privileges"; exit 1; }
            grep -qx $'NoNewPrivs:\t1' <<<"$haupt" || { echo "$s: Hauptprozess ohne no-new-privileges"; exit 1; }
            # Bits: CHOWN 0, DAC_READ_SEARCH 2, FOWNER 3, SETGID 6,
            # SETUID 7, SETPCAP 8, NET_BIND_SERVICE 10
            case "$s" in
              proxy) erlaubt=$(( 1<<10 )); eff=$(( 1<<10 )) ;;
              db) erlaubt=$(( 1<<0 | 1<<2 | 1<<3 | 1<<6 | 1<<7 )); eff=0 ;;
              redis) erlaubt=$(( 1<<0 | 1<<2 | 1<<3 | 1<<6 | 1<<7 | 1<<8 )); eff=0 ;;
              *) erlaubt=0; eff=0 ;;
            esac
            bnd=$(awk '/^CapBnd/ {print $2}' <<<"$eigen")
            test $(( 0x$bnd )) -eq "$erlaubt" || { echo "$s: Faehigkeiten $bnd"; exit 1; }
            wirksam=$(awk '/^CapEff/ {print $2}' <<<"$haupt")
            test $(( 0x$wirksam )) -eq "$eff" || { echo "$s: Hauptprozess mit Faehigkeiten $wirksam"; exit 1; }
            # Eine Stelle, die ohne read_only beschreibbar waere (root
            # besitzt /, node besitzt .next, gotenberg /opt/gotenberg; sein
            # Home ist ein tmpfs, siehe docker-compose.yml)
            wo=/; case "$s" in app) wo=/app/apps/web/.next ;; gotenberg) wo=/opt/gotenberg ;; esac
            if docker exec "$c" sh -c ": > $wo/.haertung-probe" 2>/dev/null; then
              echo "$s: $wo beschreibbar"; exit 1
            fi
            grenze "$c" pids.max pids/pids.max "$s" >/dev/null
            speicher=$(grenze "$c" memory.max memory/memory.limit_in_bytes "$s")
            if [ "$s" = redis ]; then
              # maxmemory unter der Grenze: volles Redis lehnt Schreiben ab,
              # statt vom Kernel beendet zu werden
              mm=$(docker compose exec -T redis sh -c 'REDISCLI_AUTH="$(cat /run/redis-auth/password)" redis-cli CONFIG GET maxmemory' | sed -n 2p)
              test "$mm" -gt 0 && test "$mm" -lt "$speicher" || { echo "redis: maxmemory $mm, Grenze $speicher"; exit 1; }
            fi
          done
          schreibt() {
            local u=; case "$1" in db) u="-u postgres" ;; redis) u="-u redis" ;; esac
            # shellcheck disable=SC2086
            docker compose exec -T $u "$1" sh -c ": > '$2/.haertung-probe' && rm '$2/.haertung-probe'"
          }
          for ort in app:/tmp app:/app/apps/web/.next/cache app:/app/uploads app:/app/data \
                     db:/var/run/postgresql gotenberg:/tmp gotenberg:/home/gotenberg \
                     proxy:/data proxy:/config redis:/data; do
            schreibt "${ort%%:*}" "${ort#*:}"
          done
          # Der Cache von Next.js: /_next/image legt dort als node an, auch
          # wenn es das SVG danach mit 400 ablehnt (gehoerte der tmpfs root,
          # stuende EACCES im Log der App)
          curl -sSk -o /dev/null "https://localhost:${APP_PORT:-7891}/_next/image?url=%2Ficon.svg&w=64&q=75"
          docker compose exec -T app test -d /app/apps/web/.next/cache/images
          if docker compose logs app | grep -E 'EACCES|EROFS'; then exit 1; fi

      # Redis weist ohne Passwort ab (redis-cli endet dabei mit 0, deshalb
      # die Antwort), die Prozesse der App haben es in REDIS_URL, und der
      # Collab-Server hat sich damit angemeldet (SUBSCRIBE geht erst nach
      # der Anmeldung). Das Passwort steht weder in der Konfiguration noch
      # in einer Befehlszeile, die docker inspect zeigt. Ein App-Image von
      # vor dem Passwort (Einstieg von 84a44cc) bleibt nicht still gesund:
      # der Healthcheck meldet es, auch mit init: true, und nur dann.
      - name: Redis nur mit Passwort
        run: |
          set -euo pipefail
          rcli() { docker compose exec -T redis sh -c 'REDISCLI_AUTH="$(cat /run/redis-auth/password)" redis-cli "$@"' rcli "$@"; }
          docker compose exec -T redis redis-cli PING | grep -q '^NOAUTH'
          test "$(rcli PING)" = PONG
          # Nur Prozesse des Stacks: Prozesse aus docker exec (dieses sh,
          # der Healthcheck) haben PPid 0 und die Umgebung des Containers
          docker compose exec -T app sh -s <<'SH'
          set -eu
          pw=$(cat /run/redis-auth/password)
          test -n "$pw"
          n=0
          for p in /proc/[0-9]*; do
            st=$(cat "$p/status" 2>/dev/null) || continue
            ppid=$(printf '%s\n' "$st" | sed -n 's/^PPid:[[:space:]]*//p')
            [ "${p#/proc/}" = 1 ] || [ "$ppid" != 0 ] || continue
            e=$(tr '\0' '\n' < "$p/environ" 2>/dev/null) || continue
            [ -n "$e" ] || continue
            printf '%s\n' "$e" | grep -qx "REDIS_URL=redis://:$pw@redis:6379" \
              || { echo "ohne Passwort: $p $(cat "$p/comm" 2>/dev/null)"; exit 1; }
            n=$((n + 1))
          done
          test "$n" -ge 3
          SH
          angemeldet=
          for i in $(seq 1 15); do
            if rcli CLIENT LIST | grep -q 'cmd=subscribe'; then angemeldet=1; break; fi
            sleep 2
          done
          test -n "$angemeldet"
          if docker compose logs app | grep -E 'NOAUTH|WRONGPASS|Redis-Passwort'; then exit 1; fi
          PW=$(docker compose exec -T redis cat /run/redis-auth/password)
          if docker inspect $(docker compose ps -q) | grep -qF "$PW"; then echo "Passwort in docker inspect"; exit 1; fi

          # Healthcheck der App, wie Docker ihn ausfuehrt, in einem
          # Container mit altem Einstieg (Image ohne Passwortblock) und zur
          # Kontrolle mit dem Einstieg des Images; beide ohne Server
          # (sleep), die Meldung kommt vor der Abfrage.
          VOR=84a44cc68366e5219c700017be6cc5b6d9ff2258
          git fetch --no-tags --depth=1 origin "$VOR"
          git show "$VOR:scripts/docker-entrypoint.sh" > "$RUNNER_TEMP/alt-einstieg.sh"
          docker compose run -d --no-deps --name ci-alt-einstieg \
            -v "$RUNNER_TEMP/alt-einstieg.sh:/alt-einstieg.sh:ro" --entrypoint sh app /alt-einstieg.sh sleep 300 >/dev/null
          docker compose run -d --no-deps --name ci-neu-einstieg app sleep 300 >/dev/null
          HC=$(docker inspect -f '{{index .Config.Healthcheck.Test 3}}' ci-alt-einstieg)
          sleep 2
          if docker exec ci-alt-einstieg node -e "$HC" >"$RUNNER_TEMP/hc-alt"; then exit 1; fi
          grep -q 'ohne Redis-Passwort' "$RUNNER_TEMP/hc-alt"
          docker exec ci-neu-einstieg node -e "$HC" >"$RUNNER_TEMP/hc-neu" || true
          if grep 'ohne Redis-Passwort' "$RUNNER_TEMP/hc-neu"; then exit 1; fi
          # Dasselbe mit init: true aus einer override-Datei: PID 1 ist dann
          # docker-init mit der Umgebung des Containers, der Server erst
          # dessen Kind. Neuer Einstieg ohne Meldung, alter weiter gemeldet.
          printf 'services:\n  app:\n    init: true\n' > "$RUNNER_TEMP/init.yml"
          mit_init() { docker compose -f docker-compose.yml -f "$RUNNER_TEMP/init.yml" "$@"; }
          mit_init run -d --no-deps --name ci-alt-init \
            -v "$RUNNER_TEMP/alt-einstieg.sh:/alt-einstieg.sh:ro" --entrypoint sh app /alt-einstieg.sh sleep 300 >/dev/null
          mit_init run -d --no-deps --name ci-neu-init app sleep 300 >/dev/null
          sleep 2
          for c in ci-alt-init ci-neu-init; do test "$(docker exec "$c" cat /proc/1/comm)" = docker-init; done
          if docker exec ci-alt-init node -e "$HC" >"$RUNNER_TEMP/hc-alt-init"; then exit 1; fi
          grep -q 'ohne Redis-Passwort' "$RUNNER_TEMP/hc-alt-init"
          docker exec ci-neu-init node -e "$HC" >"$RUNNER_TEMP/hc-neu-init" || true
          if grep 'ohne Redis-Passwort' "$RUNNER_TEMP/hc-neu-init"; then exit 1; fi
          docker rm -f ci-alt-einstieg ci-neu-einstieg ci-alt-init ci-neu-init >/dev/null
          test "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q app)")" = healthy

      # Gotenbergs Allow-List: ein Horchposten in der App (im selben Netz
      # wie Gotenberg, also erreichbar), dann ein PDF aus HTML, das ihn per
      # Bild und per CSS nennt. Das PDF muss entstehen und das eingebettete
      # data:-Bild enthalten, der Horchposten darf ausser der Kontrolle
      # nichts sehen. Per IP, nicht per Name: Chromium stuft http mit
      # Hostnamen auf https hoch und scheitert dann am TLS, die Probe sagte
      # sonst nichts. Eine IP nutzt auch ein Angreifer. Das HTML hat
      # bewusst keine Meta-CSP: der Schritt prueft allein die Allow-List.
      - name: PDF-Dienst laedt keine fremden Adressen
        run: |
          set -euo pipefail
          FALLE=$(docker compose exec -T gotenberg getent hosts app | awk '{print $1}')
          test -n "$FALLE"
          docker compose exec -T app rm -f /tmp/falle.log
          docker compose exec -d -T app node -e 'require("node:http").createServer((q,s)=>{require("node:fs").appendFileSync("/tmp/falle.log",q.url+"\n");s.end()}).listen(3999)'
          bereit=
          for i in $(seq 1 10); do
            if docker compose exec -T gotenberg curl -fsS -o /dev/null "http://$FALLE:3999/kontrolle"; then bereit=1; break; fi
            sleep 1
          done
          test -n "$bereit"
          # Gotenberg hat keinen Healthcheck, auf den `up --wait` warten
          # koennte: vor dem POST auf seine API warten
          for i in $(seq 1 10); do docker compose exec -T app node -e 'fetch("http://gotenberg:3000/health").then(r=>process.exit(r.ok?0:1),()=>process.exit(1))' && break; sleep 1; done
          PNG=iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8DwHwAFBQIAX8jx0gAAAABJRU5ErkJggg==
          HTML="<!DOCTYPE html><html><head><meta charset=\"utf-8\"></head><body><p>Probe</p><img src=\"data:image/png;base64,$PNG\"><img alt=\"\" src=\"http://$FALLE:3999/bild\"><p style=\"background-image:url(http://$FALLE:3999/stil)\">x</p></body></html>"
          printf '%s' "$HTML" | docker compose exec -T app node -e '
            const html = require("node:fs").readFileSync(0, "utf8");
            const form = new FormData();
            form.set("files", new File([html], "index.html", { type: "text/html" }));
            fetch("http://gotenberg:3000/forms/chromium/convert/html", { method: "POST", body: form })
              .then(async (r) => {
                if (!r.ok) process.exit(1);
                process.stdout.write(Buffer.from(await r.arrayBuffer()));
              }, () => process.exit(1));' >"$RUNNER_TEMP/probe.pdf"
          test "$(head -c 5 "$RUNNER_TEMP/probe.pdf")" = "%PDF-"
          # Das eingebettete data:-Bild ist im PDF (sperrte die Liste auch data:,
          # fehlten alle Upload-Bilder und Diagramme in jedem PDF). Die Falle
          # traegt alt="": sonst zeichnete Chromium fuer das gesperrte Bild ein
          # Symbol, das im PDF ebenfalls als Bild zaehlt.
          test "$(grep -ac '/Subtype /Image' "$RUNNER_TEMP/probe.pdf")" -ge 1
          sleep 1
          test "$(docker compose exec -T app cat /tmp/falle.log)" = "/kontrolle"

      # Ein Stoss grosser Exporte bleibt unter der Speichergrenze von
      # Gotenberg: acht gleichzeitige Umwandlungen einer Seite mit gut 13 MB
      # eingebetteten Bildern (die Grenze des Exports liegt bei 16 MB). Mit
      # der Vorgabe von 6 gleichzeitigen Umwandlungen beendete der Kernel
      # Chromium, und alle laufenden Exporte scheiterten.
      - name: PDF-Dienst haelt einen Stoss grosser Exporte aus
        run: |
          set -euo pipefail
          docker compose exec -T app node - <<'JS'
          const zlib = require("node:zlib");
          const crypto = require("node:crypto");
          // Rauschen als unkomprimiertes PNG: Chromium muss es ganz dekodieren
          function png(w, h) {
            const roh = Buffer.alloc((w * 3 + 1) * h);
            crypto.randomFillSync(roh);
            for (let y = 0; y < h; y++) roh[y * (w * 3 + 1)] = 0;
            const teil = (typ, daten) => {
              const l = Buffer.alloc(4); l.writeUInt32BE(daten.length);
              const t = Buffer.from(typ);
              const c = Buffer.alloc(4); c.writeUInt32BE(zlib.crc32(Buffer.concat([t, daten])));
              return Buffer.concat([l, t, daten, c]);
            };
            const kopf = Buffer.alloc(13);
            kopf.writeUInt32BE(w, 0); kopf.writeUInt32BE(h, 4); kopf[8] = 8; kopf[9] = 2;
            return Buffer.concat([Buffer.from([137, 80, 78, 71, 13, 10, 26, 10]), teil("IHDR", kopf),
              teil("IDAT", zlib.deflateSync(roh, { level: 0 })), teil("IEND", Buffer.alloc(0))]);
          }
          const html = "<!DOCTYPE html><html><head><meta charset=\"utf-8\"></head><body>" +
            Array.from({ length: 5 }, () => `<img src="data:image/png;base64,${png(1000, 700).toString("base64")}">`).join("") +
            "</body></html>";
          console.log(`Seite: ${(html.length / 1048576).toFixed(1)} MB`);
          Promise.all(Array.from({ length: 8 }, () => {
            const form = new FormData();
            form.set("files", new File([html], "index.html", { type: "text/html" }));
            return fetch("http://gotenberg:3000/forms/chromium/convert/html", { method: "POST", body: form })
              .then(async (r) => { await r.arrayBuffer(); return r.status; }, (e) => String(e));
          })).then((antworten) => {
            console.log(antworten.join(" "));
            process.exit(antworten.every((a) => a === 200) ? 0 : 1);
          });
          JS
          test "$(docker inspect -f '{{.State.OOMKilled}}' "$(docker compose ps -q gotenberg)")" = false

      # Sicherung und Rueckweg mit genau den Befehlen aus dem README. Einmal
      # auf demselben Stack, einmal auf einem frisch angelegten (wie nach
      # einem Plattenausfall, mit getrennt gesichertem APP_SECRET).
      - name: Sichern und zurückspielen (Rundlauf)
        run: |
          set -euo pipefail
          sql() { docker compose exec -T db psql -X -U dokunc -d dokunc -v ON_ERROR_STOP=1 -At -c "$1"; }
          im_app() { docker compose exec -T app sh -c "$1"; }
          secret_summe() { docker compose exec -T app cat /app/data/app_secret | sha256sum; }
          # Der Mail-Dispatcher im Collab-Prozess markiert ohne SMTP jede
          # offene Benachrichtigung sofort als gemailt (erster Lauf 5 s nach
          # dem Start, unabhaengig von MAIL_DISPATCH_INTERVAL_S). Solange
          # seine Sperre belegt ist, laeuft er nicht; sonst waere die
          # Pruefung von Schritt 12 unten auch ohne Schritt 12 gruen.
          sperre_mails() {
            test "$(docker compose exec -T redis sh -c 'REDISCLI_AUTH="$(cat /run/redis-auth/password)" redis-cli SET dokunc:mail-dispatch:lock ci-rundlauf PX 3600000')" = OK
          }
          warte_auf_health() {
            for i in $(seq 1 30); do
              curl -fsSk "https://localhost:${APP_PORT:-7891}/api/health" | grep -q '"status":"ok"' && return 0
              sleep 2
            done
            return 1
          }
          SECRET="$RUNNER_TEMP/app_secret"
          ./scripts/backup.sh --secret-sichern "$SECRET"
          test "$(stat -c %a "$SECRET")" = 600
          test -s backups/.app_secret-merkmal
          SUMME=$(secret_summe)
          MIGRATIONEN=$(sql 'SELECT count(*) FROM "_prisma_migrations"')
          test -z "$(sql 'SELECT "restoreEpoch" FROM "InstanceState"')"

          # Stand der Sicherung, dazu eine Person mit offener Sitzung und
          # eine noch nicht gemailte Benachrichtigung (Schritt 12 des Skripts)
          sperre_mails
          sql "CREATE TABLE ci_rundlauf (wert text); INSERT INTO ci_rundlauf VALUES ('vorher')"
          sql "INSERT INTO \"User\" (id, email, name, \"passwordHash\", \"updatedAt\") VALUES ('ci-rundlauf', 'ci-rundlauf@example.test', 'CI', 'x', now());
               INSERT INTO \"Session\" (id, \"userId\", \"expiresAt\") VALUES ('ci-rundlauf', 'ci-rundlauf', now() + interval '7 days');
               INSERT INTO \"Notification\" (id, \"userId\", type) VALUES ('ci-rundlauf', 'ci-rundlauf', 'MENTION')"
          test "$(sql 'SELECT count(*) FROM "Session" WHERE "revokedAt" IS NULL')" -ge 1
          test "$(sql 'SELECT count(*) FROM "Notification" WHERE "emailedAt" IS NULL')" -ge 1
          im_app 'echo vorher > /app/uploads/ci-vorher.txt'
          TS=$(./scripts/backup.sh 2>"$RUNNER_TEMP/backup.err" | sed -n 's#.*backups/db-\(.*\)\.dump$#\1#p')
          test -n "$TS"
          # Secret getrennt gesichert und passend: ein erfolgreicher Lauf
          # schreibt nichts auf stderr (cron)
          test ! -s "$RUNNER_TEMP/backup.err" || { cat "$RUNNER_TEMP/backup.err" >&2; false; }
          # Archiv direkt aus dem Volume (compose run ... tar czf -). Erst in
          # eine Datei: grep -q in einer Pipe liesse tar an SIGPIPE sterben.
          tar tzf "backups/uploads-$TS.tar.gz" >"$RUNNER_TEMP/liste"
          grep -qx './ci-vorher.txt' "$RUNNER_TEMP/liste"
          # Noch offen, also auch in der Sicherung offen
          test "$(sql "SELECT \"emailedAt\" IS NULL FROM \"Notification\" WHERE id = 'ci-rundlauf'")" = t

          # Aenderungen danach, darunter eine neue Tabelle (wie eine Migration)
          sql "UPDATE ci_rundlauf SET wert = 'nachher'"
          sql "CREATE TABLE ci_nach_sicherung (x int)"
          im_app 'rm /app/uploads/ci-vorher.txt; echo nachher > /app/uploads/ci-nachher.txt'

          pruefe_stand() {
            test "$(sql 'SELECT wert FROM ci_rundlauf')" = vorher
            test -z "$(sql "SELECT to_regclass('public.ci_nach_sicherung')")"
            test "$(sql 'SELECT count(*) FROM "_prisma_migrations"')" = "$MIGRATIONEN"
            im_app 'test -f /app/uploads/ci-vorher.txt && test ! -e /app/uploads/ci-nachher.txt'
            sql 'SELECT "restoreEpoch" FROM "InstanceState"' | grep -Eqx '[0-9a-f]{32}'
            test "$(sql 'SELECT count(*) FROM "Session" WHERE "revokedAt" IS NULL')" = 0
            test "$(sql 'SELECT count(*) FROM "Notification" WHERE "emailedAt" IS NULL')" = 0
            # Beides aus der Transaktion von Schritt 12 (gleiches now() wie
            # restoredAt), nicht vom Dispatcher oder einer Abmeldung
            test "$(sql "SELECT s.\"revokedAt\" = i.\"restoredAt\" FROM \"Session\" s, \"InstanceState\" i WHERE s.id = 'ci-rundlauf'")" = t
            test "$(sql "SELECT n.\"emailedAt\" = i.\"restoredAt\" FROM \"Notification\" n, \"InstanceState\" i WHERE n.id = 'ci-rundlauf'")" = t
            test "$(secret_summe)" = "$SUMME"
            warte_auf_health
          }

          # 1. Rueckweg auf demselben Stack (mit Vorsicherung)
          ./scripts/restore.sh --ja "$TS"
          pruefe_stand
          EPOCHE1=$(sql 'SELECT "restoreEpoch" FROM "InstanceState"')
          test "$(ls backups/db-*.dump | wc -l)" -ge 2
          test "$(sql "SELECT count(*) FROM pg_database WHERE datname LIKE 'dokunc\_vor\_%'")" = 1

          # 2. Neuer Host: Volumes weg, frischer Stack mit neuem Secret
          docker compose down -v
          docker compose up -d --wait --wait-timeout 600
          sperre_mails
          test "$(secret_summe)" != "$SUMME"
          # Das neue Secret erkennt backup.sh am Merkmal (echter node-Aufruf im
          # Image). Erst in eine Variable: grep -q in einer Pipe liesse backup.sh
          # an SIGPIPE sterben.
          WARNUNG=$(./scripts/backup.sh 2>&1 >/dev/null)
          grep -q 'ein anderes als bei der letzten getrennten Sicherung' <<<"$WARNUNG"
          ./scripts/restore.sh --ja --ohne-vorsicherung --secret "$SECRET" "$TS"
          pruefe_stand
          test "$(sql 'SELECT "restoreEpoch" FROM "InstanceState"')" != "$EPOCHE1"

          # Nach dem Zuruecklegen passt das Merkmal wieder, auch wenn die Datei
          # im Volume ein Zeilenende traegt (Editor): die App liest den Wert
          # ohne, das Merkmal auch.
          WARNUNG=$(./scripts/backup.sh 2>&1 >/dev/null)
          test -z "$WARNUNG" || { echo "$WARNUNG" >&2; false; }
          docker compose exec -T app sh -c 'printf "\n" >> /app/data/app_secret'
          WARNUNG=$(./scripts/backup.sh 2>&1 >/dev/null)
          test -z "$WARNUNG" || { echo "$WARNUNG" >&2; false; }

      # Eine Installation vom Stand vor der Haertung (Commit 84a44cc) mit
      # Bestand in Datenbank, Uploads, Secret und Redis, dann
      # die letzte Zeile des Update-Befehls aus dem README. Der Bestand muss
      # bleiben, die Sitzungen gelten weiter (gleiches Secret), Redis
      # verlangt danach ein Passwort, und der Proxy sieht die Datenbank
      # nicht mehr. pull und build --pull prueft "Update-Weg aus dem
      # README"; hier liegen die Images schon vor. Der alte Stand nutzt das
      # App-Image aus dem aktuellen Checkout; dessen Einstieg tut ohne
      # REDIS_PASSWORD_FILE nichts Neues. Ein altes App-Image mit der neuen
      # Datei prueft "Redis nur mit Passwort" (Healthcheck).
      - name: Update von einer Installation vor der Haertung
        run: |
          set -euo pipefail
          VOR=84a44cc68366e5219c700017be6cc5b6d9ff2258
          git fetch --no-tags --depth=1 origin "$VOR"
          git show "$VOR:docker-compose.yml" > "$RUNNER_TEMP/vor-haertung.yml"
          alt() { docker compose --project-directory . -f "$RUNNER_TEMP/vor-haertung.yml" "$@"; }
          sql() { docker compose exec -T db psql -X -U dokunc -d dokunc -v ON_ERROR_STOP=1 -At -c "$1"; }
          docker compose down -v
          alt up -d --wait --wait-timeout 600
          alt exec -T db psql -X -U dokunc -d dokunc -v ON_ERROR_STOP=1 -c "CREATE TABLE ci_update (wert text); INSERT INTO ci_update VALUES ('vorher')"
          alt exec -T app sh -c 'echo vorher > /app/uploads/ci-update.txt'
          SUMME=$(alt exec -T app cat /app/data/app_secret | sha256sum)
          test "$(alt exec -T redis redis-cli SET ci:update vorher)" = OK
          docker compose up -d --wait --wait-timeout 600
          test "$(sql 'SELECT wert FROM ci_update')" = vorher
          docker compose exec -T app sh -c 'test "$(cat /app/uploads/ci-update.txt)" = vorher'
          test "$(docker compose exec -T app cat /app/data/app_secret | sha256sum)" = "$SUMME"
          test "$(docker compose exec -T redis sh -c 'REDISCLI_AUTH="$(cat /run/redis-auth/password)" redis-cli GET ci:update')" = vorher
          docker compose exec -T redis redis-cli PING | grep -q '^NOAUTH'
          if docker compose exec -T proxy getent hosts db; then echo "Proxy sieht nach dem Update die Datenbank"; exit 1; fi
          for i in $(seq 1 30); do
            curl -fsSk "https://localhost:${APP_PORT:-7891}/api/health" | grep -q '"status":"ok"' && exit 0
            sleep 2
          done
          echo "Nach dem Update von vor der Haertung antwortet der Proxy nicht"
          exit 1

      # Kette vorgelagerter Proxy -> mitgelieferter Caddy -> App: Sonden in
      # eigenen Containern mit festen Adressen zeigen verschiedene
      # Client-Adressen in der Anmeldebremse, im Audit-Log und in der
      # Collab-Grenze, ein gefaelschter Anfang von X-Forwarded-For zaehlt
      # nicht, und der Weg am vorgelagerten Proxy vorbei steht als Warnung
      # im Log (Teil a); die Bremse je Adresse ist per Umgebung
      # einstellbar (Teil b); eine ausgenommene Adresse wird in App und
      # Collab-Server nicht je Adresse gebremst (Teil c). Dateien in
      # .github/proxy-kette. Danach wieder der Normalstapel.
      - name: Proxy-Kette
        timeout-minutes: 8
        run: |
          set -euo pipefail
          KETTE="-f docker-compose.yml -f .github/proxy-kette/compose.yml"
          docker compose $KETTE up -d --wait --wait-timeout 300
          NETZ=$(docker compose $KETTE config --format json | jq -r .networks.kette.name)
          BILD="$(docker compose config --format json | jq -r .name)-app"
          NETZ="$NETZ" BILD="$BILD" bash .github/proxy-kette/pruefen.sh a b c
          docker compose up -d --wait --wait-timeout 300 --remove-orphans

      # Nur das eigene Image: Postgres, Redis, Caddy und Gotenberg haben
      # fast immer offene Meldungen, die erst ein neues Upstream-Image behebt
      # (das holt der Update-Befehl). Laeuft auch, wenn der Rundlauf
      # scheitert, solange der Stack gebaut wurde. Compose nennt das
      # gebaute Image <Projektname>-app; es ueberlebt down -v im Rundlauf.
      - name: Image der App ermitteln
        id: bild
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: echo "ref=$(docker compose config --format json | jq -r .name)-app" >> "$GITHUB_OUTPUT"

      - name: Image der App auf Luecken pruefen (Trivy)
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.bild.outputs.ref }}
          version: v0.74.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml

      - name: Zustand und Logs bei Fehlschlag
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 80 app
          docker compose logs --no-color --tail 30 proxy db redis gotenberg

      - name: Aufräumen
        if: always()
        run: docker compose down -v
