name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @dokunc/db generate

      - name: Unit tests
        run: pnpm --filter @dokunc/web test

      - name: Typecheck collab server
        run: pnpm --filter @dokunc/collab build

      - name: Build web
        run: pnpm --filter @dokunc/web build
        env:
          NODE_ENV: production

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dokunc
          POSTGRES_PASSWORD: dokunc
          POSTGRES_DB: dokunc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dokunc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dokunc:dokunc@localhost:5432/dokunc?schema=public
      REDIS_URL: redis://localhost:6379
      APP_SECRET: ci-only-secret-please-32-chars-minimum!!
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_COLLAB_URL: ws://localhost:3001
      COLLAB_PORT: 3001
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @dokunc/db generate

      - name: Run migrations
        run: pnpm --filter @dokunc/db migrate:deploy

      - name: Build web
        run: pnpm --filter @dokunc/web build

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
