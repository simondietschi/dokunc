name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @dokunc/db generate

      - name: Unit tests
        run: pnpm --filter @dokunc/web test

      - name: Typecheck collab server
        run: pnpm --filter @dokunc/collab build

      - name: Build web
        run: pnpm --filter @dokunc/web build
        env:
          NODE_ENV: production
