name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts löst DATABASE_URL strikt auf — für generate/build
      # reicht ein Platzhalter (es wird keine Verbindung aufgebaut).
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @dokunc/db generate

      - name: Unit tests
        run: pnpm --filter @dokunc/web test

      - name: Typecheck collab server
        run: pnpm --filter @dokunc/collab build

      - name: Build web
        run: pnpm --filter @dokunc/web build
        env:
          NODE_ENV: production

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dokunc
          POSTGRES_PASSWORD: dokunc
          POSTGRES_DB: dokunc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dokunc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dokunc:dokunc@localhost:5432/dokunc?schema=public
      REDIS_URL: redis://localhost:6379
      APP_SECRET: ci-only-secret-please-32-chars-minimum!!
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_COLLAB_URL: ws://localhost:3001
      COLLAB_PORT: 3001
    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @dokunc/db generate

      - name: Run migrations
        run: pnpm --filter @dokunc/db migrate:deploy

      - name: Build web
        run: pnpm --filter @dokunc/web build

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Prüft genau den Weg aus dem README: frisch geklont, keine .env,
  # ein `docker compose up -d`. Fängt Image-/Compose-Fehler ab, die
  # weder Unit- noch E2E-Tests sehen.
  docker:
    name: Docker-Stack (ohne .env)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sicherstellen, dass keine .env existiert
        run: test ! -f .env

      - name: Stack bauen und starten
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Health-Endpunkt über den Proxy
        run: |
          curl -fsSk https://localhost/api/health | grep -q '"status":"ok"'

      - name: Anmeldeseite wird ausgeliefert
        run: curl -fsSk https://localhost/login -o /dev/null

      - name: APP_SECRET wurde automatisch erzeugt
        run: |
          docker compose exec -T app sh -c 'test -s /app/data/app_secret'

      - name: Logs bei Fehlschlag
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Aufräumen
        if: always()
        run: docker compose down -v
