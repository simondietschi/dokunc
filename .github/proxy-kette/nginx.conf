# Vorgelagerter Proxy im Kettentest (CI-Job docker, Schritt "Proxy-Kette"):
# steht fuer einen Load Balancer vor dem mitgelieferten Caddy.
#
# $proxy_add_x_forwarded_for behaelt den X-Forwarded-For der Sonden und
# haengt die eigene Gegenstelle an, so wie docs/admin/network.md es von
# einem vorgelagerten Proxy verlangt. Ein gefaelschter Anfang erreicht so
# die App, und der Test prueft, dass sie von rechts zaehlt.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;

    location / {
        proxy_pass https://proxy:443;
        # WebSocket des Collab-Servers: Upgrade und Connection reicht nginx
        # nicht von selbst weiter (ohne sie kommt 200 statt 101 zurueck),
        # und die nginx-Dokumentation verlangt dafuer HTTP/1.1 zum Upstream.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Den Host-Kopf des Browsers samt Port behalten, wie
        # docs/admin/network.md es vom vorgelagerten Proxy verlangt.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Caddy stellt fuer localhost ein Zertifikat seiner eigenen CA aus
        # (CADDY_TLS=internal); der Test prueft die Kette, nicht TLS.
        proxy_ssl_server_name on;
        proxy_ssl_name localhost;
        proxy_ssl_verify off;
    }
}
