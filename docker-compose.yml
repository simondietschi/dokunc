services:
  # TLS-Terminierung + einziger nach außen (nur localhost) exponierter Dienst.
  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "127.0.0.1:443:443"
      - "127.0.0.1:80:80"

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_COLLAB_URL: ${NEXT_PUBLIC_COLLAB_URL:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dokunc:${POSTGRES_PASSWORD:-dokunc}@db:5432/dokunc?schema=public
      REDIS_URL: redis://redis:6379
      # Leer = der Container erzeugt beim ersten Start ein zufälliges
      # Secret und legt es dauerhaft im Volume app_data ab. Ein eigenes
      # (empfohlen, z. B. für mehrere Instanzen) hat immer Vorrang:
      # APP_SECRET in .env setzen — openssl rand -base64 48
      APP_SECRET: ${APP_SECRET:-}
      JWT_EXPIRES_IN: 7d
      APP_URL: ${APP_URL:-https://localhost}
      # Leer = zur Laufzeit aus der aufgerufenen Adresse abgeleitet
      # (wss://<host>/collab). Nur setzen, wenn der Collab-Server unter
      # einer anderen Adresse läuft (dann Rebuild nötig, s. README).
      NEXT_PUBLIC_COLLAB_URL: ${NEXT_PUBLIC_COLLAB_URL:-}
      COLLAB_PORT: 3001
      NODE_ENV: production
      # Reverse-Proxys vor der App (hier: Caddy). Bestimmt, wie die
      # Ratenbegrenzung die Client-IP aus X-Forwarded-For liest.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      # E-Mail (Einladungen) — optional, ohne SMTP_HOST nur Log-Fallback
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-dokunc <no-reply@example.com>}
      UPLOAD_DIR: /app/uploads
      # Import (Markdown/Confluence/Notion): Upload-Limit pro Import in MB
      IMPORT_MAX_MB: ${IMPORT_MAX_MB:-100}
      # KI — optional; ohne Key sind die KI-Features deaktiviert
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      # PDF-Export über den mitlaufenden Gotenberg-Service
      GOTENBERG_URL: ${GOTENBERG_URL:-http://gotenberg:3000}
    volumes:
      - uploads:/app/uploads
      # Hält u. a. das automatisch erzeugte APP_SECRET (überlebt Updates).
      - app_data:/app/data
    # Keine Host-Ports: nur über den Proxy im internen Docker-Netz erreichbar.
    expose:
      - "3000"
      - "3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    # Zwei Node-Prozesse (Next + Hocuspocus) in einem Container; bei
    # kleinen Hosts kann der Wert gesenkt werden.
    mem_limit: 2g
    cpus: 1.5

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: dokunc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dokunc}
      POSTGRES_DB: dokunc
    volumes:
      # Ab Postgres 18 gehört der Mount auf /var/lib/postgresql (das Image
      # legt darunter ein versionsspezifisches Verzeichnis an). Auf dem
      # alten Pfad /var/lib/postgresql/data verweigert es den Start.
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dokunc"]
      interval: 5s
      timeout: 5s
      retries: 10

  # HTML -> PDF (Seiten-Export). Nur intern erreichbar.
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --api-timeout=30s

  redis:
    image: redis:8
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  redis_data:
  uploads:
  app_data:
  caddy_data:
  caddy_config:
