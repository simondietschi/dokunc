services:
  # TLS-Terminierung + einziger nach aussen exponierter Dienst (Vorgabe:
  # nur localhost, s. APP_BIND).
  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      # internal = Caddys eigene CA; für eine eigene Domain die eigene
      # Mailadresse (ACME, Let's Encrypt). Leer zählt wie nicht gesetzt:
      # ein leerer Wert brächte die Caddyfile nicht durch den Parser.
      CADDY_TLS: ${CADDY_TLS:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Host-Port 7891 -> Caddy 443 (https://localhost:7891). Port 80 ist
    # hier nicht gemappt: die HTTP->HTTPS-Umleitung würde auf :443 zeigen,
    # und ein belegter Port 80 auf dem Host liesse schon den Schnellstart
    # scheitern. Für eine eigene Domain bringt docker-compose.domain.yml
    # ihn dazu (s. README).
    #
    # Bindeadresse aus APP_BIND, Vorgabe 127.0.0.1: ohne .env ist die
    # Instanz nur vom Server selbst aus erreichbar (kein LAN-Zugriff).
    # Für eine eigene Domain in der .env APP_BIND=0.0.0.0 und APP_PORT=443
    # setzen — APP_PORT allein genügt nicht, sonst antwortet die Instanz
    # weiter nur auf dem Loopback des Servers. Leer zählt wie nicht
    # gesetzt (`:-`): ein leerer Eintrag `APP_BIND=` in der .env fällt auf
    # die Vorgabe zurück, statt host_ip leer zu lassen (daran bricht
    # docker compose mit "invalid ip address" ab). Ganz ohne host_ip
    # bände Docker dagegen still auf allen Adressen, 0.0.0.0 und ::.
    #
    # 0.0.0.0 heisst nur IPv4: mit ausdrücklicher Adresse veröffentlicht
    # Docker nur in deren Adressfamilie, und host_ip nimmt genau einen
    # Wert. Die IPv6-Gegenstücke bringt docker-compose.ipv6.yml (APP_BIND6).
    #
    # Lange Schreibweise, weil host_ip eine IPv6-Adresse wie `::` ohne
    # Klammern annimmt; in der kurzen ("ip:port:port") wäre sie mehrdeutig.
    #
    # Die sichere Vorgabe prüfen apps/web/src/compose-ports.test.ts (für
    # alle Compose-Dateien) und der CI-Job docker (am laufenden Stack und
    # per docker compose config).
    ports:
      - target: 443
        published: "${APP_PORT:-7891}"
        host_ip: "${APP_BIND:-127.0.0.1}"
        protocol: tcp
    # Nur im Netz edge mit der App: der Proxy erreicht weder Datenbank noch
    # Redis (siehe networks: unten).
    networks:
      - edge
    # Härtung, für alle Dienste gleich aufgebaut (README „Sicherheit“,
    # Container gehärtet): alle Fähigkeiten abgeben und nur die nötigen
    # zurück, keine neuen Rechte über setuid, Dateisystem schreibgeschützt,
    # Grenzen für Speicher und Prozesse. Caddy braucht NET_BIND_SERVICE,
    # sein Programm trägt diese Fähigkeit als Dateiattribut und startet
    # ohne sie nicht. Geschrieben wird nur in die Volumes /data und /config.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    mem_limit: 256m
    pids_limit: 256

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_COLLAB_URL: ${NEXT_PUBLIC_COLLAB_URL:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dokunc:${POSTGRES_PASSWORD:-dokunc}@db:5432/dokunc?schema=public
      REDIS_URL: redis://redis:6379
      # Passwort für Redis: erzeugt der Dienst redis beim ersten Start im
      # Volume redis_auth, der Einstieg der App setzt es in REDIS_URL
      # (scripts/docker-entrypoint.sh). Nichts einzutragen.
      REDIS_PASSWORD_FILE: /run/redis-auth/password
      # Leer = der Container erzeugt beim ersten Start ein zufälliges
      # Secret und legt es dauerhaft im Volume app_data ab. Ein eigenes
      # in der .env hat immer Vorrang und ist nur nötig, wenn mehrere
      # Instanzen dasselbe Secret teilen. Läuft die Instanz schon, den
      # bestehenden Wert übernehmen, nie einen neuen erzeugen: ein neuer
      # meldet alle ab und sperrt die Zwei-Faktor-Anmeldung (README
      # „Secret wechseln“).
      APP_SECRET: ${APP_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Abmeldung nach Untätigkeit, z. B. 12h. Leer = keine Grenze
      # (Einzelheiten in .env.example).
      SESSION_IDLE_TIMEOUT: ${SESSION_IDLE_TIMEOUT:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Muss denselben Namen tragen wie SITE_ADDRESS oben: die App
      # nimmt nur Anfragen von hier an (Upload, Import, Collab-Ticket).
      APP_URL: ${APP_URL:-https://localhost:7891}
      # Leer = zur Laufzeit aus der aufgerufenen Adresse abgeleitet
      # (wss://<host>/collab). Nur setzen, wenn der Collab-Server unter
      # einer anderen Adresse läuft (dann Rebuild nötig, s. README).
      NEXT_PUBLIC_COLLAB_URL: ${NEXT_PUBLIC_COLLAB_URL:-}
      COLLAB_PORT: 3001
      # Grenzen des Collab-Servers (Einzelheiten in .env.example). Leer =
      # Vorgabe.
      COLLAB_MAX_CONNECTIONS: ${COLLAB_MAX_CONNECTIONS:-}
      COLLAB_MAX_CONNECTIONS_PER_IP: ${COLLAB_MAX_CONNECTIONS_PER_IP:-}
      COLLAB_MAX_CONNECTIONS_PER_USER: ${COLLAB_MAX_CONNECTIONS_PER_USER:-}
      COLLAB_MAX_ATTEMPTS_PER_IP: ${COLLAB_MAX_ATTEMPTS_PER_IP:-}
      COLLAB_MAX_ATTEMPTS_PER_USER: ${COLLAB_MAX_ATTEMPTS_PER_USER:-}
      # Grössengrenzen in MB (Vorgabe 16 und 17). Die App liest
      # COLLAB_MAX_DOC_MB für die Liste unter /admin/documents.
      COLLAB_MAX_DOC_MB: ${COLLAB_MAX_DOC_MB:-}
      COLLAB_MAX_MESSAGE_MB: ${COLLAB_MAX_MESSAGE_MB:-}
      NODE_ENV: production
      # Reverse-Proxys vor der App (hier: Caddy). Bestimmt, wie die
      # Ratenbegrenzung die Client-IP aus X-Forwarded-For liest. Gilt auch
      # für die Verbindungsgrenzen des Collab-Servers.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      # Anzeigename der Instanz (Aussteller im Authenticator)
      APP_NAME: ${APP_NAME:-dokunc}
      # Single Sign-on (OIDC) — optional, ohne OIDC_ISSUER abgeschaltet
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      OIDC_BUTTON_LABEL: ${OIDC_BUTTON_LABEL:-Single Sign-on}
      OIDC_ALLOW_SIGNUP: ${OIDC_ALLOW_SIGNUP:-false}
      OIDC_AUTO_LINK_BY_EMAIL: ${OIDC_AUTO_LINK_BY_EMAIL:-true}
      # Claims und vertraute Domains (leer = Vorgabe, siehe .env.example)
      OIDC_TRUSTED_EMAIL_DOMAINS: ${OIDC_TRUSTED_EMAIL_DOMAINS:-}
      OIDC_EMAIL_CLAIM: ${OIDC_EMAIL_CLAIM:-}
      OIDC_NAME_CLAIM: ${OIDC_NAME_CLAIM:-}
      OIDC_SUBJECT_CLAIM: ${OIDC_SUBJECT_CLAIM:-}
      # E-Mail (Einladungen, Passwort-Reset) — optional. Ohne SMTP_HOST
      # kommen die Links hier nicht an: unter NODE_ENV production stehen
      # sie auch nicht im Log.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-dokunc <no-reply@example.com>}
      # Ohne Mailserver: wer den Einladungslink zur Weitergabe von Hand
      # sieht (admins oder managers, Einzelheiten in .env.example). Leer =
      # Vorgabe admins.
      INVITE_LINK_WITHOUT_MAIL: ${INVITE_LINK_WITHOUT_MAIL:-}
      # Benachrichtigungs-Mails: Prüfintervall (s) und Digest-Stunde (UTC)
      MAIL_DISPATCH_INTERVAL_S: ${MAIL_DISPATCH_INTERVAL_S:-30}
      DIGEST_HOUR_UTC: ${DIGEST_HOUR_UTC:-6}
      UPLOAD_DIR: /app/uploads
      # Maximale Groesse einer hochgeladenen Datei (Bilder und Anhaenge) in MB
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      # Aufraeumer fuer verwaiste Uploads: Abstand in Stunden (1 bis 168), 0 = aus
      UPLOAD_SWEEP_INTERVAL_H: ${UPLOAD_SWEEP_INTERVAL_H:-6}
      # Aufbewahrung (taeglich, Einzelheiten in .env.example). 0 = unbegrenzt.
      SESSION_RETENTION_DAYS: ${SESSION_RETENTION_DAYS:-30}
      TOKEN_RETENTION_DAYS: ${TOKEN_RETENTION_DAYS:-30}
      NOTIFICATION_RETENTION_DAYS: ${NOTIFICATION_RETENTION_DAYS:-90}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-0}
      # Versionen ausduennen: standard oder off
      VERSION_RETENTION: ${VERSION_RETENTION:-standard}
      # Import (Markdown/Confluence/Notion): Upload-Limit pro Import in MB
      IMPORT_MAX_MB: ${IMPORT_MAX_MB:-100}
      # Import: gleichzeitige Importe (alle Konten; je Konto hoechstens 1)
      # und Zeitgrenze in Sekunden (1 bis 3600)
      IMPORT_MAX_CONCURRENT: ${IMPORT_MAX_CONCURRENT:-2}
      IMPORT_TIMEOUT_S: ${IMPORT_TIMEOUT_S:-80}
      # KI — optional; ohne Key sind die KI-Features deaktiviert
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      # KI-Index im Collab-Prozess: Abstand der Laeufe in Sekunden (10 bis
      # 3600, 0 = aus, dann wird kein Seitentext mehr eingebettet) und
      # Abschnitte je Anfrage an Voyage (1 bis 256, siehe .env.example)
      AI_INDEX_INTERVAL_S: ${AI_INDEX_INTERVAL_S:-60}
      AI_INDEX_EMBED_BATCH: ${AI_INDEX_EMBED_BATCH:-64}
      # PDF-Export über den mitlaufenden Gotenberg-Service
      GOTENBERG_URL: ${GOTENBERG_URL:-http://gotenberg:3000}
    volumes:
      - uploads:/app/uploads
      # Hält u. a. das automatisch erzeugte APP_SECRET (überlebt Updates).
      - app_data:/app/data
      - redis_auth:/run/redis-auth:ro
    # Keine Host-Ports: nur über den Proxy im internen Docker-Netz erreichbar.
    expose:
      - "3000"
      - "3001"
    # Zuerst: hat der Server das Redis-Passwort, wenn es eines gibt? Das
    # setzt der Einstieg des Images (scripts/docker-entrypoint.sh). Ein
    # App-Image von vor dem Passwort (up -d ohne neuen Build, altes Image
    # per docker tag) liefe sonst gesund, aber ohne Redis (NOAUTH).
    # Geprüft werden alle Prozesse des Containers ausser denen aus docker
    # exec (PPid 0, auch dieser Healthcheck), und einer mit Passwort
    # genügt: mit init: true oder tini ist PID 1 der Init-Prozess mit der
    # Umgebung des Containers, der Server erst dessen Kind.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const fs = require("node:fs");
          const datei = process.env.REDIS_PASSWORD_FILE;
          let pw = "";
          try { pw = datei ? fs.readFileSync(datei, "utf8").trim() : ""; } catch {}
          const urls = [];
          for (const p of fs.readdirSync("/proc")) {
            if (/\D/.test(p)) continue;
            try {
              const ppid = /^PPid:\s*(\d+)/m.exec(fs.readFileSync("/proc/" + p + "/status", "utf8"))?.[1];
              if (p !== "1" && ppid === "0") continue;
              const z = fs.readFileSync("/proc/" + p + "/environ", "utf8")
                .split(String.fromCharCode(0)).find((z) => z.startsWith("REDIS_URL="));
              if (z) urls.push(z.slice(10));
            } catch {}
          }
          const ohne = (u) => u === "redis://redis:6379" || u.startsWith("redis://redis:6379/");
          if (pw && urls.length > 0 && urls.every(ohne)) {
            console.log("dokunc: REDIS_URL der App ohne Redis-Passwort, App-Image neu bauen");
            process.exit(1);
          }
          fetch("http://127.0.0.1:3000/api/health").then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1));
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    # Zwei Node-Prozesse (Next + Hocuspocus) in einem Container; bei
    # kleinen Hosts kann der Wert gesenkt werden.
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 512
    # Läuft als node und braucht keine Fähigkeit. Schreibt nur in die
    # Volumes und in zwei tmpfs: /tmp (Caches von Node und tsx) und den
    # Cache von Next.js (/_next/image legt dort an). Ein tmpfs gehört
    # root und übernimmt nur den Modus des Ordners im Image (0755), darum
    # mode=1777: sonst kann node dort nicht schreiben.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /app/apps/web/.next/cache:size=64m,mode=1777
    # Standardnetz für Datenbank, Redis und Ausgang (SMTP, OIDC,
    # KI-Dienste), edge für den Proxy, render für Gotenberg (siehe
    # networks: unten).
    networks:
      - default
      - edge
      - render

  db:
    # Auf das Debian-Release festgelegt: ein neues Release bringt eine neue
    # C-Bibliothek und damit eine andere Sortierung von Text (README, Update
    # und Rückweg).
    image: postgres:18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: dokunc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dokunc}
      POSTGRES_DB: dokunc
    volumes:
      # Ab Postgres 18 gehört der Mount auf /var/lib/postgresql (das Image
      # legt darunter ein versionsspezifisches Verzeichnis an). Auf dem
      # alten Pfad /var/lib/postgresql/data verweigert es den Start.
      - db_data:/var/lib/postgresql
    # Der Einstieg des Images läuft als root, richtet Besitz und Rechte ein
    # (CHOWN, DAC_READ_SEARCH, FOWNER) und wechselt dann zum Nutzer
    # postgres (SETUID, SETGID); der Server selbst hat keine Fähigkeit.
    # Schreibt in das Volume und den Socket-Ordner (tmpfs).
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /var/run/postgresql
    mem_limit: 2g
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dokunc"]
      interval: 5s
      timeout: 5s
      retries: 10

  # HTML -> PDF (Seiten-Export). Nur die App erreicht ihn, und er selbst
  # erreicht nur die App und den Docker-Host (über die Gateway-Adresse des
  # Netzes render, siehe networks: unten): im Netz render ohne Ausgang, und
  # sein Chromium lädt nur die eigene Arbeitsdatei unter /tmp und eingebettete
  # data:-Bilder. Ohne diese Liste lud es jede Bildadresse aus dem
  # Seiteninhalt, auch Adressen im Docker-Netz oder im LAN. Das exportierte
  # HTML sperrt dasselbe zusätzlich mit einer eigenen CSP (lib/csp.ts).
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - "--chromium-allow-list=^(file:///tmp/|data:)"
      - --api-timeout=30s
      # Zwei Umwandlungen zugleich (Vorgabe von Gotenberg: 6), weitere
      # warten, höchstens bis --api-timeout. Mit 6 zugleich sprengen schon
      # vier bis sechs grosse Seiten die Speichergrenze unten, und der Kernel
      # beendet Chromium samt allen laufenden Exporten.
      - --chromium-max-concurrency=2
    networks:
      - render
    # Läuft als Nutzer gotenberg, Chromium ohne eigene Sandbox: keine
    # Fähigkeit nötig. Arbeitsdateien und Profil liegen in /tmp (tmpfs,
    # zählt zum Speicher). Das Home braucht ebenfalls einen tmpfs: Chromium
    # legt dort den Ordner für Absturzberichte an und startet seinen
    # Crash-Handler damit. Ist es schreibgeschützt, startet Chromium je nach
    # Umgebung gar nicht ("chrome_crashpad_handler: --database is required",
    # so in der CI auf ubuntu-latest). Bedarf: zwei Umwandlungen mal gut 430 MB für die
    # grösste Seite, die der Export erlaubt (16 MB eingebettete Bilder),
    # dazu jede wartende Anfrage mit ihrer Datei. Gemessen mit 1 GB und
    # Seiten mit gut 13 MB eingebetteten Bildern: 12 gleichzeitige Exporte
    # laufen durch, mehr als die Bremse einem Konto erlaubt (10 in 10
    # Minuten); ab 15 beendet der Kernel Gotenberg. Wer mehr erwartet,
    # setzt mem_limit höher (2 GB: 20).
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
      - /home/gotenberg:mode=1777
    mem_limit: 1g
    pids_limit: 512

  # Mit Passwort: scripts/redis-start.sh erzeugt es beim ersten Start im
  # Volume redis_auth und hängt es per --include an (auch an ein eigenes
  # command aus einer docker-compose.override.yml; ein eigenes --requirepass
  # darin gilt weiter und landet selbst in der Passwortdatei). Von Hand:
  # docker compose exec redis sh -c 'REDISCLI_AUTH="$(cat /run/redis-auth/password)" redis-cli'
  redis:
    image: redis:8
    restart: unless-stopped
    entrypoint: ["sh", "/usr/local/bin/dokunc-redis-start"]
    # maxmemory unter mem_limit (unten): ist Redis voll, lehnt es Schreiben
    # ab (noeviction), statt vom Kernel beendet zu werden und alle
    # Verbindungen samt der letzten Schreibvorgänge zu verlieren. Der
    # Abstand deckt den Fork beim Umschreiben der AOF-Datei. Wer command
    # in einer override-Datei setzt, übernimmt diesen Wert.
    command: redis-server --appendonly yes --maxmemory-policy noeviction --maxmemory 384mb
    volumes:
      - redis_data:/data
      - redis_auth:/run/redis-auth
      - ./scripts/redis-start.sh:/usr/local/bin/dokunc-redis-start:ro
    # Der Einstieg des Images richtet /data ein und wechselt mit setpriv
    # zum Nutzer redis (SETUID, SETGID, SETPCAP für das Leeren der
    # Fähigkeiten); der Server selbst hat keine Fähigkeit.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, FOWNER, SETGID, SETPCAP, SETUID]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      # redis-cli endet auch bei NOAUTH mit 0, darum die Antwort prüfen
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/redis-auth/password)\" redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

# Drei Netze. default: App, Datenbank, Redis und jeder Dienst einer
# docker-compose.override.yml ohne eigene networks-Angabe (pgAdmin, eigene
# Sicherung erreichen die Datenbank also weiter). Nicht intern, sonst
# verlören Ports an db, redis oder eigenen Diensten still ihre Wirkung, und
# eigene Dienste kämen nicht mehr ins Internet. edge: Proxy und App; der
# Proxy hängt nur hier und erreicht Datenbank und Redis nicht. Ein eigener
# Dienst, den der Proxy erreichen soll, gibt sich networks: [default, edge].
#
# Gotenberg hängt nur im Netz render, zusammen mit der App. render ist
# intern (ohne Ausgang): das Chromium des PDF-Dienstes erreicht damit
# weder Datenbank noch Redis, das LAN oder das Internet. Erreichbar bleibt
# der Docker-Host selbst über die Gateway-Adresse von render, also Dienste,
# die dort auf allen Adressen lauschen. Das schliesst erst
# driver_opts: {com.docker.network.bridge.gateway_mode_ipv4: isolated};
# Docker Engine vor 28.0 kennt diesen Wert nicht (27.x bricht mit "unknown
# gateway mode isolated" ab), darum steht er nicht hier, sondern als
# Möglichkeit im README ("Sicherheit"). Alle anderen
# Dienste ausser dem Proxy, auch solche aus einer
# docker-compose.override.yml ohne eigene networks-Angabe, bleiben im
# Standardnetz. Wer in einer override-Datei
# einen Dienst Gotenberg nutzen lässt, gibt ihm networks: [default, render].
networks:
  edge: {}
  render:
    internal: true

volumes:
  db_data:
  redis_data:
  # Redis-Passwort (password, redis.conf), nur an redis und app. Nicht in
  # der Sicherung: fehlt es, entsteht beim nächsten Start ein neues.
  redis_auth:
  uploads:
  app_data:
  caddy_data:
  caddy_config:
