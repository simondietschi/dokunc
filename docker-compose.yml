services:
  # TLS-Terminierung + einziger nach außen (nur localhost) exponierter Dienst.
  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "127.0.0.1:443:443"
      - "127.0.0.1:80:80"

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_COLLAB_URL: ${NEXT_PUBLIC_COLLAB_URL:-wss://localhost/collab}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dokunc:${POSTGRES_PASSWORD:-dokunc}@db:5432/dokunc?schema=public
      REDIS_URL: redis://redis:6379
      # Fail-closed: ohne gesetztes, ausreichend langes Secret kein Start.
      APP_SECRET: ${APP_SECRET:?APP_SECRET muss gesetzt sein (min. 32 Zeichen)}
      JWT_EXPIRES_IN: 7d
      APP_URL: ${APP_URL:-https://localhost}
      NEXT_PUBLIC_COLLAB_URL: ${NEXT_PUBLIC_COLLAB_URL:-wss://localhost/collab}
      COLLAB_PORT: 3001
      NODE_ENV: production
      # E-Mail (Einladungen) — optional, ohne SMTP_HOST nur Log-Fallback
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-dokunc <no-reply@example.com>}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    # Keine Host-Ports: nur über den Proxy im internen Docker-Netz erreichbar.
    expose:
      - "3000"
      - "3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    mem_limit: 1g
    cpus: 1.5

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: dokunc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dokunc}
      POSTGRES_DB: dokunc
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dokunc"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  redis_data:
  uploads:
  caddy_data:
  caddy_config:
