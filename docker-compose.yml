services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_COLLAB_URL: ${NEXT_PUBLIC_COLLAB_URL:-ws://localhost:3001}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dokunc:dokunc@db:5432/dokunc?schema=public
      REDIS_URL: redis://redis:6379
      APP_SECRET: ${APP_SECRET:-change-me-please-change-me-please-32+}
      JWT_EXPIRES_IN: 7d
      APP_URL: ${APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_COLLAB_URL: ${NEXT_PUBLIC_COLLAB_URL:-ws://localhost:3001}
      COLLAB_PORT: 3001
      NODE_ENV: production
    ports:
      - "3000:3000"
      - "3001:3001"

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dokunc
      POSTGRES_PASSWORD: dokunc
      POSTGRES_DB: dokunc
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dokunc"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  redis_data:
